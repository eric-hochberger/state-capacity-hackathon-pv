<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAP Browser</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1dc;
    --accent: #0b5cad; --accent-soft: #e6effa;
    --s-filed: #8a5a00; --s-filed-bg: #fbf0d9;
    --s-noticed: #6a3fa0; --s-noticed-bg: #efe7f9;
    --s-review: #0b6b3a; --s-review-bg: #dff3e7;
    --s-done: #555; --s-done-bg: #ecebe8;
    --s-hold: #a12a2a; --s-hold-bg: #f8e1e1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --panel: #1f1f1d; --ink: #ecebe7; --muted: #a09e98; --line: #34332f;
      --accent: #6ea8ec; --accent-soft: #1d2b3c;
      --s-filed: #f0c46a; --s-filed-bg: #3a2e14; --s-noticed: #c6a6f0; --s-noticed-bg: #2e2440;
      --s-review: #7fd9a4; --s-review-bg: #173226; --s-done: #bbb; --s-done-bg: #2d2d2a;
      --s-hold: #f09a9a; --s-hold-bg: #3d1e1e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 440px; height: 100vh; }
  #map { height: 100%; background: var(--bg); }
  aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0 0 2px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 12px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .search { width: 100%; margin-top: 10px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
  .district { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .district h2 { font-size: 15px; margin: 0; }
  .district .count { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; font-size: 12px; padding: 0; }
  .list { overflow-y: auto; flex: 1; padding: 8px 16px 24px; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 10px; }
  .card h3 { font-size: 14px; margin: 0 0 4px; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a:hover { color: var(--accent); text-decoration: underline; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; }
  .b-filed { color: var(--s-filed); background: var(--s-filed-bg); }
  .b-noticed { color: var(--s-noticed); background: var(--s-noticed-bg); }
  .b-review { color: var(--s-review); background: var(--s-review-bg); }
  .b-done { color: var(--s-done); background: var(--s-done-bg); }
  .b-hold { color: var(--s-hold); background: var(--s-hold-bg); }
  .milestone { margin: 8px 0 0; font-size: 12.5px; }
  .brief { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .brief.open { -webkit-line-clamp: unset; }
  .legend { background: var(--panel); color: var(--ink); padding: 8px 10px; border-radius: 6px; font-size: 11px; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .legend i { display: inline-block; width: 14px; height: 10px; margin-right: 4px; vertical-align: middle; }
  .leaflet-tooltip { font: 12px system-ui, sans-serif; }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <div id="map"></div>
  <aside>
    <header>
      <h1>ZAP Browser</h1>
      <div class="sub" id="source"></div>
      <div class="filters" id="filters"></div>
      <input class="search" id="search" type="search" placeholder="Search name, applicant, ULURP #…">
    </header>
    <div class="district" id="district"></div>
    <div class="list" id="list"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script>
const PROJECTS = window.ZAP_PROJECTS;
const STATUSES = [
  { key: "Filed", cls: "b-filed" },
  { key: "Noticed", cls: "b-noticed" },
  { key: "In Public Review", cls: "b-review" },
  { key: "Completed", cls: "b-done", label: "Review complete" },
  { key: "On-Hold", cls: "b-hold", label: "On hold" },
];
// "On-Hold" is a project_status; the rest are public_status values of Active projects.
const statusOf = p => p.project_status === "On-Hold" ? "On-Hold" : (p.public_status || "Filed");
const active = new Set(["Filed", "Noticed", "In Public Review", "Completed"]);
let selected = null; // CD code, "CITYWIDE", or null
let query = "";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const parseDate = s => { if (!s) return 0; const [m, d, y] = s.split("/"); return +new Date(+y, m - 1, +d); };
const fmtDate = s => s ? new Date(parseDate(s)).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";

function visible() {
  const q = query.toLowerCase();
  return PROJECTS.filter(p => active.has(statusOf(p)) && (!q ||
    [p.project_name, p.project_id, p.primary_applicant, p.ulurp_numbers, p.project_brief, p.actions]
      .some(v => v && v.toLowerCase().includes(q))));
}
const isCitywide = p => !p.cds.length || p.cds.every(c => c.startsWith("CY"));

// ---------- Map ----------
const map = L.map("map", { zoomSnap: 0.25 }).setView([40.705, -73.94], 11);
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${dark ? "Dark" : "Light"}_Gray_Base/MapServer/tile/{z}/{y}/{x}`, {
  attribution: 'Tiles &copy; Esri · Data: NYC DCP Zoning Application Portal',
  maxZoom: 16,
}).addTo(map);

const RAMP = dark
  ? ["#2a2a28", "#1f3a57", "#23548a", "#2c6fb8", "#4b8fd6", "#8cbcf0"]
  : ["#f1f0ec", "#d4e3f4", "#a7c6ea", "#6fa2d9", "#3a79c2", "#0b4f99"];
const BREAKS = [0, 1, 3, 6, 10, 20];
const colorFor = n => RAMP[BREAKS.reduce((i, b, j) => n >= b ? j : i, 0)];
let counts = {};

const layer = L.geoJSON(window.CD_BOUNDARIES, {
  style: f => styleFor(f),
  onEachFeature: (f, l) => {
    l.on({
      click: () => select(f.properties.code),
      mouseover: e => { e.target.setStyle({ weight: 2.5 }); e.target.bringToFront(); },
      mouseout: e => layer.resetStyle(e.target),
    });
    l.bindTooltip(() => `<b>${label(f.properties.code)}</b><br>${counts[f.properties.code] || 0} open application${counts[f.properties.code] === 1 ? "" : "s"}`, { sticky: true });
  },
}).addTo(map);
map.fitBounds(layer.getBounds(), { padding: [10, 10] });

function styleFor(f) {
  const sel = f.properties.code === selected;
  return {
    fillColor: colorFor(counts[f.properties.code] || 0), fillOpacity: f.properties.jia ? 0.25 : 0.7,
    color: sel ? (dark ? "#ffd166" : "#d1495b") : (dark ? "#555" : "#fff"),
    weight: sel ? 3 : 1, dashArray: f.properties.jia ? "3 3" : null,
  };
}

const featureByCode = {};
layer.eachLayer(l => featureByCode[l.feature.properties.code] = l);
function label(code) {
  if (code === "CITYWIDE") return "Citywide / no district";
  const f = featureByCode[code]?.feature.properties;
  if (!f) return code;
  return f.jia ? `${f.boro} Joint Interest Area ${f.num}` : `${f.boro} Community Board ${f.num}`;
}

const legend = L.control({ position: "bottomleft" });
legend.onAdd = () => {
  const d = L.DomUtil.create("div", "legend");
  d.innerHTML = "<b>Open applications</b><br>" + BREAKS.map((b, i) =>
    `<i style="background:${RAMP[i]}"></i>${b}${BREAKS[i + 1] ? (BREAKS[i + 1] - 1 > b ? "–" + (BREAKS[i + 1] - 1) : "") : "+"}`).join("<br>");
  return d;
};
legend.addTo(map);

// ---------- Sidebar ----------
document.getElementById("source").textContent =
  `${PROJECTS.length} open projects · source: ${window.ZAP_SOURCE}`;

const filtersEl = document.getElementById("filters");
STATUSES.forEach(s => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = s.label || s.key;
  b.setAttribute("aria-pressed", active.has(s.key));
  b.onclick = () => {
    active.has(s.key) ? active.delete(s.key) : active.add(s.key);
    b.setAttribute("aria-pressed", active.has(s.key)); render();
  };
  filtersEl.appendChild(b);
});
document.getElementById("search").addEventListener("input", e => { query = e.target.value.trim(); render(); });

function select(code) {
  selected = code;
  history.replaceState(null, "", code ? "#" + code : location.pathname);
  if (code && featureByCode[code]) map.fitBounds(featureByCode[code].getBounds(), { maxZoom: 13, padding: [30, 30] });
  render();
}

function card(p) {
  const st = STATUSES.find(s => s.key === statusOf(p));
  const url = `https://zap.planning.nyc.gov/projects/${encodeURIComponent(p.project_id)}`;
  const meta = [
    `<span class="badge ${st.cls}">${esc(st.label || st.key)}</span>`,
    esc(p.project_id),
    p.ulurp_non && esc(p.ulurp_non),
    p.actions && `Actions: ${esc(p.actions)}`,
    p.cds.length > 1 && `Districts: ${esc(p.cds.join(", "))}`,
    p.mih_flag === "true" && "MIH",
  ].filter(Boolean).map(x => `<span>${x}</span>`).join("");
  return `<div class="card">
    <h3><a href="${url}" target="_blank" rel="noopener">${esc(p.project_name || "(untitled)")}</a></h3>
    <div class="meta">${meta}</div>
    ${p.current_milestone ? `<p class="milestone">${esc(p.current_milestone)}${p.current_milestone_date ? ` · <span class="sub">${fmtDate(p.current_milestone_date)}</span>` : ""}</p>` : ""}
    ${p.primary_applicant ? `<div class="sub">Applicant: ${esc(p.primary_applicant)}${p.applicant_type ? ` (${esc(p.applicant_type)})` : ""}</div>` : ""}
    ${p.ulurp_numbers ? `<div class="sub">ULURP: ${esc(p.ulurp_numbers)}</div>` : ""}
    ${p.project_brief ? `<p class="brief" title="Click to expand">${esc(p.project_brief)}</p>` : ""}
  </div>`;
}

function render() {
  const vis = visible();
  counts = {};
  let citywide = 0;
  vis.forEach(p => { isCitywide(p) ? citywide++ : p.cds.forEach(c => counts[c] = (counts[c] || 0) + 1); });
  layer.setStyle(styleFor);

  const distEl = document.getElementById("district"), listEl = document.getElementById("list");
  if (!selected) {
    distEl.innerHTML = `<h2>Click a community district</h2>
      <button class="linkbtn" onclick="select('CITYWIDE')">Citywide (${citywide})</button>`;
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 12);
    listEl.innerHTML = `<p class="sub" style="margin-top:12px">Busiest districts with the current filters:</p>` +
      top.map(([c, n]) => `<div class="card" style="cursor:pointer" onclick="select('${c}')"><b>${esc(label(c))}</b> <span class="sub">· ${n}</span></div>`).join("");
    return;
  }
  const list = vis.filter(p => selected === "CITYWIDE" ? isCitywide(p) : p.cds.includes(selected))
    .sort((a, b) => parseDate(b.current_milestone_date || b.app_filed_date) - parseDate(a.current_milestone_date || a.app_filed_date));
  distEl.innerHTML = `<div><h2>${esc(label(selected))}</h2><span class="count">${list.length} open application${list.length === 1 ? "" : "s"}</span></div>
    <button class="linkbtn" onclick="select(null)">Clear</button>`;
  listEl.innerHTML = list.length ? list.map(card).join("") : `<div class="empty">No open applications match these filters.</div>`;
}

document.getElementById("list").addEventListener("click", e => {
  if (e.target.classList.contains("brief")) e.target.classList.toggle("open");
});

const initial = location.hash.slice(1);
if (initial && (featureByCode[initial] || initial === "CITYWIDE")) select(initial); else render();
</script>
</body>
</html>
